name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_path: dist/*.exe
          - os: macos-latest
            target: mac
            artifact_path: dist/mac/*.dmg
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        if: matrix.target == 'win'
        run: npm run dist:win

      - name: Build macOS disk image
        if: matrix.target == 'mac'
        run: npm run dist:mac

      - name: Upload release files for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release files were downloaded" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" \
              --generate-notes --notes-file - <<'NOTES'
          ## First launch on macOS

          Open the DMG, drag **Decksona** to **Applications**, then try opening Decksona once. If macOS blocks it, dismiss the alert and go to **System Settings → Privacy & Security → Security**. Click **Open Anyway** for Decksona and confirm if offered. [Apple’s instructions](https://support.apple.com/en-us/102445)
          NOTES
          fi
