name: Build Decksona for Windows

on:
  push:
    branches: [codex/windows-logo-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Decksona-Windows-x64
          path: dist/Decksona.exe
          if-no-files-found: error
